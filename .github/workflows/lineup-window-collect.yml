name: Lineup window collect

# Collects per-plate-appearance rows from StatsAPI's play-by-play -- the whole
# current model family by default, or one slate with the `date` input --
# so the registered fixed-window lineup rescore has the half the committed
# artifacts cannot supply: a PREFIX of the game. A box score gives a whole-game
# total and a starter-allowed total, and neither is the first N batters faced.
#
# It then runs `hitter_level_probe` on the same rows, which is the ONLY place
# that probe can run: it needs the collector's `batter_id` beside the committed
# per-hitter frames, and StatsAPI is unreachable from the dev sandbox. Until
# this step existed the probe had no caller anywhere -- a fully-tested module
# whose sample could never start accumulating. It answers the question the
# team-level component line cannot: whether the fault in the lineup term is the
# per-hitter RATE or the AGGREGATION that averages nine of them into one
# number. Both are diagnostic; neither feeds a lean, a delta or a grade.
#
# It then runs `lineup_agg_probe`, the team-level half of the same question.
# That one needs no live API at all -- it reads the committed frames and the
# committed ledger -- but it belongs beside the other half rather than in
# build.yml, because the two are read together: the per-hitter probe DERIVES
# the weights a composite should use, and the panel bounds how much any
# weighting could matter. A reader given one without the other reaches for a
# ranking of correlations none of which is readable yet.
#
# Backfill, not lookahead. A finished game's play-by-play is immutable in the
# same sense `actuals_backfill`'s box scores are; nothing here touches the
# prediction side, which is what `.savant_cache/` being gitignored forbids
# reconstructing.
#
# It runs here because StatsAPI is unreachable from the dev sandbox -- the
# proxy answers 403 to CONNECT -- so the event map cannot be smoke-tested
# locally. That is the same constraint every live-API probe in this repo
# carries, and the reason the collector reconciles every game against the box
# score before reporting any rate: a mis-mapped eventType is the failure that
# would otherwise be silent.
#
# The COLLECT job is read-only, and `contents: read` makes that structural:
# data/ belongs to the Actions bot's build job, and the collector's outputs
# leave as an artifact. The one exception is the separate `publish` job below,
# which commits exactly one file -- data/pitcher_lineup_report.txt -- on
# main-branch family runs, so the latest report is kept in the repo.
#
# Deliberately outside the `site-build` concurrency group -- the collector never writes to
# data/, so it has no reason to queue behind a build.
on:
  pull_request:
    paths:
      - 'lineup_window_collect.py'
      - 'hitter_level_probe.py'
      - 'lineup_agg_probe.py'
      - 'pitcher_lineup_probe.py'
      - '.github/workflows/lineup-window-collect.yml'
  # Daily, so each morning's run under Actions carries a fresh report without
  # a manual dispatch. 11:23 UTC (7:23am ET) is after build.yml's 04:17 and
  # 10:07 grading passes, which backfill the act_woba the collector's scope
  # requires, and off the hour to dodge GitHub's top-of-hour cron congestion.
  # A scheduled run has no `inputs`, so the date expression below is empty and
  # the whole current family is collected, and `publish`
  # stores the report under data/.
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'One slate (leave empty to run the whole current family)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40        # ~300 feed/live payloads; the collector's own
                               # BUDGET_S stops it well before this fires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # The event map and the prefix logic are checked before the collector is
      # allowed near real games. A wrong cross or a mis-mapped event yields a
      # plausible rate rather than an error, so this gate is not a formality.
      - name: Verify the event map, the window logic and the hitter join
        run: |
          python -m pytest tests/test_lineup_window_collect.py \
                           tests/test_hitter_level_probe.py \
                           tests/test_lineup_agg_probe.py \
                           tests/test_pitcher_lineup_probe.py -q

      - name: Collect
        run: |
          python lineup_window_collect.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --out lineup_window_pa.csv \
            --report lineup_window_collect_report.txt

      # Reads the collector's output and the committed data/hitters_*.csv. The
      # prediction half is whatever the build froze pregame, so this never
      # reconstructs a prediction and the no-lookahead invariant is untouched:
      # only the OUTCOME half is fetched, and a finished game's play-by-play is
      # immutable in the same sense actuals_backfill's box scores are.
      # Not `if: always()` -- with no PA rows the probe prints its own "nothing
      # supplied" message, which would read as a result rather than a failed
      # collect.
      - name: Score each hitter against his own plate appearances
        run: |
          # pipefail explicitly: the runner's default shell is `bash -e`, so a
          # crash in the probe would exit through tee's status and this step
          # would pass while uploading a truncated report.
          set -o pipefail
          python hitter_level_probe.py \
            --pa lineup_window_pa.csv \
            --hitters data \
            | tee hitter_level_probe_report.txt

      # The team-level half of the same question, and the only half that can
      # run without the collector: it reads the committed frames and the
      # committed ledger. It is here rather than in build.yml because the two
      # halves are read together -- the per-hitter probe derives the weights
      # a composite should use, this one bounds how much any weighting could
      # matter -- and a reader who has one without the other will reach for a
      # ranking of unreadable correlations. `if: always()` because it needs no
      # PA rows: a failed collect must not also cost the half that does not
      # depend on it.
      - name: Score the aggregation panel on the committed frames
        if: always()
        run: |
          set -o pipefail
          python lineup_agg_probe.py | tee lineup_agg_probe_report.txt

      # The pitcher x lineup interaction: each hitter's stored rate against
      # the starter the frame named, scored on that starter's PAs only. This
      # is the question the per-hitter frames were stored to measure -- the
      # ledger keeps only the log5 product, so whether hitter and starter
      # combine multiplicatively (B*P/L) or additively is invisible there.
      # Needs the collector's rows, so it is not `if: always()`.
      - name: Score the pitcher x lineup interaction
        run: |
          set -o pipefail
          python pitcher_lineup_probe.py \
            --pa lineup_window_pa.csv \
            --hitters data \
            | tee pitcher_lineup_probe_report.txt

      - name: Confirm nothing was written to data/
        run: |
          if ! git diff --quiet -- data/; then
            echo "::error::collector modified data/ -- it must be read-only"
            git --no-pager diff --stat -- data/
            exit 1
          fi
          echo "data/ clean"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineup-window-collect
          path: |
            lineup_window_collect_report.txt
            lineup_window_pa.csv
            hitter_level_probe_report.txt
            lineup_agg_probe_report.txt
            pitcher_lineup_probe_report.txt
          if-no-files-found: warn

  # Stores the pitcher x lineup report at data/pitcher_lineup_report.txt so the
  # latest coefficients live beside ledger_report.txt instead of only in a
  # 90-day artifact. A separate job so `collect` keeps `contents: read` and its
  # data/-untouched check: only this short job can write, and only one file.
  #
  # Main-branch family runs only. A PR run is from a branch whose code is not
  # yet merged, and a one-slate dispatch would overwrite the whole-family
  # report with a single slate's.
  #
  # NOT in the `site-build` concurrency group, deliberately. GitHub keeps one
  # pending run per group and replaces it, so queuing here could evict a
  # pending build. It is also unnecessary: commit_data's API path pins
  # expectedHeadOid and retries when main moves, refusing only if the new
  # commit wrote this same file -- and nothing else writes it.
  publish:
    needs: collect
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !inputs.date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # commit_data needs only requests; validate_data_files is stdlib. The
      # full requirements are not installed because nothing here computes.
      - name: Install commit dependency
        run: python -m pip install requests

      - uses: actions/download-artifact@v4
        with:
          name: lineup-window-collect
          path: collect-out

      # The header names the run that produced the numbers, so a stale file
      # (a skipped or failed day) is recognisable from its own contents.
      - name: Store the report under data/
        run: |
          set -euo pipefail
          src=collect-out/pitcher_lineup_probe_report.txt
          test -s "$src"
          {
            echo "# generated $(date -u +%FT%H:%MZ) by lineup-window-collect"
            echo "# run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "# diagnostic only -- nothing here reaches a lean, delta or grade"
            echo
            cat "$src"
          } > data/pitcher_lineup_report.txt

      - name: Commit the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python validate_data_files.py
          python commit_data.py --branch main \
            --path data/pitcher_lineup_report.txt \
            --message "pitcher x lineup report $(date -u +%FT%H:%MZ)"
