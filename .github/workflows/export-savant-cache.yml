name: Export dated Savant cache

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: ET slate date whose savant cache should be exported
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore exact production cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .savant_cache
          key: savant-${{ inputs.slate_date }}
          fail-on-cache-miss: true

      - name: Upload cache for walk-forward acceptance
        uses: actions/upload-artifact@v4
        with:
          name: savant-${{ inputs.slate_date }}
          path: .savant_cache/
          if-no-files-found: error
          retention-days: 30
