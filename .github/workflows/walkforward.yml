name: Walk-forward replay

# The current model replayed sequentially over the immutable ledger. This used
# to be a step inside build.yml and it could not finish there.
#
# WHY IT MOVED. The build's job is to capture pregame rows, which cannot be
# re-derived afterwards without lookahead, so the replay was given a hard
# 450-second bound inside it (see the orphan incident in
# WorkflowStepTimeoutTests). A replay that gets 450 seconds per build finishes
# only a slice of the ledger, and the cache that carried the rest forward was
# keyed on raw file bytes -- so any edit at all, comments included, threw the
# whole thing away and restarted from the first slate. The two together meant
# the backtest never finished: on 2026-08-27 the committed replay stopped at
# 2026-08-11 while the ledger ran to 08-27, and it had never once covered the
# v12 window it exists to validate. walkforward.py now keys its cache on code
# rather than bytes; this workflow is the other half, giving the replay room
# to actually reach the present.
#
# WHY IT IS NOT IN THE `site-build` CONCURRENCY GROUP, unlike
# priors-snapshot.yml. That group serializes writes to data/ with
# `cancel-in-progress: false`, so joining it would let a long replay QUEUE
# AHEAD OF A PREGAME BUILD and delay exactly the rows the split exists to
# protect. It is safe to stay out of it because of commit_data.py: it pins
# `expectedHeadOid`, retries when the intervening commit touched none of its
# files, and refuses when it touched one. This workflow writes only
# data/walkforward_current.csv and data/walkforward_report.txt; the build
# writes the ledger and the slate dumps. Disjoint sets, so a race resolves as
# a retry rather than as an interleaved write. If this workflow ever starts
# writing a file the build also writes, put it back in `site-build`.
on:
  # Quiet hours in ET: after the 4:17am grading pass has ingested the previous
  # slate, and well clear of first pitches. Twice a day so a run that is
  # dropped or that hits its budget still catches up the next day rather than
  # falling a day further behind.
  schedule:
    - cron: '40 5 * * *'
      timezone: America/New_York
    - cron: '40 9 * * *'
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: walkforward
  cancel-in-progress: false

permissions:
  contents: write          # commit the replay output (data/) back to the repo

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Historical replay inputs are immutable for a given date, so the source
      # cache carries them between runs and only the newly graded slate is
      # fetched. Keyed on historical_data.py so changed query semantics cannot
      # silently reuse an incompatible cache generation.
      - name: Restore walk-forward source cache
        uses: actions/cache@v4
        with:
          path: .walkforward_cache
          key: walkforward-source-v1-${{ hashFiles('historical_data.py') }}-${{ github.run_id }}
          restore-keys: |
            walkforward-source-v1-${{ hashFiles('historical_data.py') }}-

      # Bounded on the PROCESS, not only on the step, and that is load-bearing
      # even with the whole job to itself. `timeout-minutes` kills the step's
      # shell and moves on while the python child survives as an orphan the
      # runner reaps only in post-job cleanup -- and this job's next steps
      # validate and commit data/. An orphan writing walkforward_current.csv
      # underneath them is the same failure that cost a slate's pregame rows
      # in run 33073467257, one workflow over. SIGINT so _atomic_csv's finally
      # removes its temp file; SIGKILL 60s later if it ignores that.
      # 2400s under a 50-minute job leaves room for install, commit and reaping.
      - name: Replay the current model over the ledger
        id: replay
        continue-on-error: true
        timeout-minutes: 45
        run: timeout --signal=INT --kill-after=60 2400 python walkforward.py

      - name: Warn when the replay is incomplete
        if: steps.replay.outcome == 'failure'
        run: echo "::warning::Walk-forward replay failed or hit its budget; it resumes from its cache next run and the report marks itself PARTIAL."

      # Commit whatever the replay got through. A partial replay is worth
      # keeping: it resumes from these rows next run, and render_report marks
      # the output PARTIAL and names the dates it did not reach, so a
      # truncated run cannot read as a complete backtest.
      - name: Commit replay output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python validate_data_files.py
          python commit_data.py --branch "${{ github.ref_name }}" \
            --message "walkforward $(date -u +%FT%H:%MZ)"
