name: Build & deploy matchup site

on:
  # Build + deploy when the workflow lands on the default branch (e.g. on
  # merge), so the site goes live without waiting for the first cron.
  push:
    branches: [main]
  # Manual trigger (lets you rebuild on demand from the Actions tab).
  workflow_dispatch:
  # GitHub cron cannot be rewritten from the day's MLB slate. Instead, a cheap
  # poll runs off the top of the hour and schedule_gate.py starts the full build
  # only when a game is 15-90 minutes from first pitch. The wide window rides
  # out Actions queue delay (runs regularly start 5-20+ min late); pending-row
  # refresh means the lock is the last pregame snapshot regardless. A separate
  # early-morning pass grades the prior slate. Timezone-aware entries avoid DST
  # drift; push/manual events always build immediately.
  schedule:
    - cron: '17 4 * * *'
      timezone: America/New_York
    - cron: '7,22,37,52 10-23 * * *'
      timezone: America/New_York

# Serialize whole workflow runs: exactly one build/deploy at a time, queued
# not cancelled, so overlapping crons can't interleave ledger commits.
concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write          # commit the grading ledger (data/) back to the repo
  pages: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      slate_date: ${{ steps.gate.outputs.slate_date }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate scheduled build against today's first pitches
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python schedule_gate.py

  build:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25        # includes the bounded pre-build replay append
    # MODEL_TAG / RECORD_TAGS / SCALE_TAGS are deliberately NOT set here. They
    # used to be pinned job-level, which made this file a third copy of the
    # model version alongside build_site.py and grade_leans.py -- and it drifted:
    # the v10 commit bumped both modules' defaults and their family maps but not
    # this block, so CI kept stamping MODEL_TAG=xw+plat_consol_v9 while running
    # v10's PA-share phase weighting. Every 2026-07-28 row carries v10 math under
    # a v9 tag as a result. Leaving them unset makes the code the single source
    # of truth: build_site.py and grade_leans.py default to the same MODEL_TAG
    # and derive RECORD_TAGS/SCALE_TAGS from _RECORD_FAMILIES/_SCALE_FAMILIES,
    # so a version bump is one edit and the two equivalence relations stay
    # wherever they are reasoned about. To re-run an older metric lineage,
    # check out its historical commit; never relabel the current wOBA source
    # with an xwOBA tag.
    steps:
      - uses: actions/checkout@v4

      # Enables Pages on first run (using the pages:write permission above) and
      # exposes the publish settings, so no manual Settings -> Pages toggle is
      # needed. No-op once Pages is already enabled.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Reproduce the notebook's once/day Savant leaderboard cache. The cache is
      # keyed to the ET slate date so a given day's CSVs are pulled once and
      # reused across that day's runs; a new day misses and re-pulls.
      - name: Restore Savant leaderboard cache
        uses: actions/cache@v4
        with:
          path: .savant_cache
          key: savant-${{ needs.plan.outputs.slate_date }}

      # Historical replay inputs are immutable for a given date. Carry them
      # forward between daily runs so walkforward.py normally fetches only the
      # newly graded slate. The provider hash prevents changed query semantics
      # from silently reusing an incompatible cache generation.
      - name: Restore walk-forward source cache
        uses: actions/cache@v4
        with:
          path: .walkforward_cache
          key: walkforward-source-v1-${{ hashFiles('historical_data.py') }}-${{ needs.plan.outputs.slate_date }}
          restore-keys: |
            walkforward-source-v1-${{ hashFiles('historical_data.py') }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A prior autostash conflict was accidentally staged into the daily
      # dumps and ledger as literal <<<<<<< / ======= / >>>>>>> rows. Fail
      # early with the exact file and line instead of letting pandas encounter
      # the marker as a game_pk during grading.
      - name: Validate committed CSV data
        run: python validate_data_files.py

      # Grade BEFORE the build: ingest any committed lean dumps and grade
      # pending games via StatsAPI linescores, so the records strip and
      # grades.html the build renders reflect last night's results in the
      # same run. The ~4:17am ET run is the one that grades yesterday.
      - name: Grade leans (pre-build)
        run: python grade_leans.py

      # Append only newly completed source-ledger dates under the current
      # replay_config_hash. This must follow grading so yesterday's finals are
      # visible, and precede build_site.py so every deployed build carries the
      # newest separate walk-forward ledger/report. A historical-source outage
      # is intentionally non-fatal: losing today's pregame production snapshot
      # would be irreversible, while this replay can resume on the next run.
      #
      # The budget is enforced on the PROCESS, not only on the step. A step
      # timeout kills the step's shell and moves on; the python child survives
      # as an orphan the runner reaps in post-job cleanup, and walkforward
      # rewrites data/walkforward_ledger.csv after every date it finishes. Run
      # 33073467257 is the instance: the step timed out at 12:55:07, the commit
      # step ran `git add data/` and committed at 12:55:50, the orphan rewrote
      # the ledger a fraction of a second later, and `git pull --rebase` refused
      # with "cannot rebase: You have unstaged changes" -- so a slate's pregame
      # rows were built, committed locally and never pushed. `timeout` blocks
      # until the child is actually dead, so no step after this one can find
      # data/ moving underneath it. SIGINT rather than SIGTERM so _atomic_csv's
      # `finally` gets to remove its temp file; SIGKILL 60s later if the process
      # ignores it. 450s sits under the 8-minute step timeout, which becomes a
      # backstop that should never fire.
      - name: Append current-model walk-forward ledger (pre-build)
        id: walkforward
        continue-on-error: true
        timeout-minutes: 8
        run: timeout --signal=INT --kill-after=60 450 python walkforward.py

      - name: Warn when walk-forward append is deferred
        if: steps.walkforward.outcome == 'failure'
        run: echo "::warning::Walk-forward append failed or timed out; the site build will continue and the replay will resume next run."

      # Build into ./public. On a hard fetch failure the script exits non-zero
      # WITHOUT writing index.html, so the steps below don't run, the artifact
      # is never uploaded, the deploy job is skipped, and the last good page
      # stays live. A legitimately empty slate writes a friendly page instead.
      - name: Build static site
        env:
          SLATE_DATE: ${{ needs.plan.outputs.slate_date }}
          CACHE_DIR: .savant_cache
          OUT_DIR: public
        run: python build_site.py

      # Paired metric shadow arm (wOBA under an xwOBA primary since v11; it
      # ran the other way round before, so the suffix names the metric inside).
      # Writes data/shadow_<date>_<metric>.csv -- or rebuild_shadow_... when
      # every game on the slate has already started, so the 4:17am pass cannot
      # overwrite a pregame dump nothing else records. Nothing
      # else: no lean, no index.html, no ledger row (grade_leans globs
      # leans_*, this is shadow_*). It exists because the wOBA-vs-xwOBA
      # question cannot be settled by comparing the two eras -- they were
      # different games, and five things changed at once. Same slate, both
      # metrics, is the only comparison with the power to resolve it.
      #
      # AFTER the primary build, and continue-on-error, both deliberately: this
      # step must never be able to cost a slate's pregame rows, which cannot be
      # re-derived later without lookahead. It also makes its own Savant fetch
      # under its own cache namespace, because it requests a different column.
      - name: xwOBA shadow arm (inert; forward test only)
        continue-on-error: true
        env:
          SLATE_DATE: ${{ needs.plan.outputs.slate_date }}
          CACHE_DIR: .savant_cache
        run: python shadow_metric.py

      # Second grading pass ingests the dumps the build just wrote (new
      # games + pending-row refresh for SP scratches). Idempotent; graded
      # rows are never touched.
      - name: Grade leans (post-build)
        run: python grade_leans.py

      # build_site.py initially renders grades.html before fetching the slate.
      # Re-render after post-build ingestion so the deployed table and pending
      # count include every matchup produced by this exact build.
      - name: Refresh grades page from final ledger
        run: python build_site.py --grades-only

      # The ledger persists by being committed. Pushes made with the default
      # GITHUB_TOKEN don't retrigger this workflow, so no recursion. Commit
      # generated data before rebasing onto any main commit that landed during
      # the run. If the rebase conflicts, Git stops before push; no autostash
      # can leave conflict-marker text behind to be blindly staged.
      - name: Commit ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python validate_data_files.py
          git add data/
          git diff --cached --quiet || git commit -m "ledger $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          python validate_data_files.py
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
